<html>
  <head>
    <title>🧌 we are in conTROLL</title>
    <style>
      .mobileOnly {
          display: block;
      }

      /* we're trying this now https://stackoverflow.com/questions/36976117/css-media-query-for-whether-a-physical-keyboard-is-attached */
      @media (hover: hover) and (pointer: fine) {
        .mobileOnly {
          display: none;
        }
      }

    </style>
    <script>
      const TROLLS = []

      const SPEED = 0.05

      const MAX_POS = 95
      const MIN_POS = 0

      let evolution = false

      function makeTrollCollision() {
        let trollCollision = []
        let _trolinternal = []

        for (i = 0; i < 100; i++) {
          trollCollision.push([])
          for (j = 0; j < 100; j++) {
            trollCollision[i].push([])
          }
        }

        return trollCollision
      }

      function updateTrolls() {
        let trollCollision = makeTrollCollision()

        TROLLS.forEach(troll => {
          let posx = parseFloat(troll.style['left'].split("%")[0])
          let posy = parseFloat(troll.style['top'].split("%")[0])

          let dirx = parseInt(troll.getAttribute("data-signx"))
          let diry = parseInt(troll.getAttribute("data-signy"))

          posx += dirx * SPEED;
          posy += diry * SPEED;

          if (posy <= MIN_POS || MAX_POS <= posy) {
            posy = Math.max(MIN_POS, Math.min(MAX_POS, posy))
            diry *= -1
          }

          if (posx <= MIN_POS || MAX_POS <= posx) {
            posx = Math.max(MIN_POS, Math.min(MAX_POS, posx))
            dirx *= -1
          }

          // this is REALLY funny but it also cannot possibly support my desired volume of trollage
          // for (k in trolls) {
          //   troll2 = trolls[k]
          //   if (troll2 != troll) {
          //     pos2x = parseFloat(troll2.style['left'].split("%")[0])
          //     pos2y = parseFloat(troll2.style['top'].split("%")[0])

          //     if (((pos2x - margin) <= posx && posx <= (pos2x + margin)) && ((pos2y - margin) <= posy && posy <= (pos2y + margin))) {
          //       dirx *= -1
          //       diry *= -1
          //       break
          //     }
          //   }
          // }

          trollCollision[Math.floor(posx)][Math.floor(posy)].push(troll)

          troll.style['left'] = `${posx}%`
          troll.style['top'] = `${posy}%`

          troll.setAttribute("data-signx", dirx)
          troll.setAttribute("data-signy", diry)
        });

        let deadTrolls = []

        TROLLS.forEach(troll => {
          let posx = parseFloat(troll.style['left'].split("%")[0])
          let posy = parseFloat(troll.style['top'].split("%")[0])

          let dirx = parseInt(troll.getAttribute("data-signx"))
          let diry = parseInt(troll.getAttribute("data-signy"))

          let colGroup = trollCollision[Math.floor(posx)][Math.floor(posy)]
          if (colGroup.length > 1) {
            dirx *= (Math.random()>0.33 ? -1 : 1)
            diry *= (Math.random()>0.33 ? -1 : 1)

            if (evolution) {
              let trollSizeCollection = []
              let totalSize = 0
              let totalSizeNotSquared = 0

              colGroup.forEach(cTroll => {
                if (deadTrolls.indexOf(cTroll) > -1) {
                  return
                }

                let size = parseInt(cTroll.style['font-size'].split("px")[0])
                trollSizeCollection.push([size*size, cTroll])
                totalSize += size*size
                totalSizeNotSquared += size
              })

              if (trollSizeCollection.length > 1) {
                trollSizeCollection.sort((a, b) => {
                  if (b[0] < a[0]) {
                    return -1
                  } else if (b[0] === a[0]) {
                    return 0
                  } else {
                    return 1
                  }
                })

                let winner = Math.random() * totalSize
                let size = 0

                let rTotal = 0
                for (let i = 0; i < trollSizeCollection.length; i++) {
                  rTotal += trollSizeCollection[i][0]
                  if (winner <= rTotal) {
                    winner = trollSizeCollection[i][1]
                    size = Math.sqrt(trollSizeCollection[i][0])
                    break
                  }
                }

                colGroup.forEach(cTroll => {
                  if (cTroll != winner) {
                    deadTrolls.push(cTroll)
                  }
                })

                size = size + Math.round(((totalSizeNotSquared - 25*(colGroup.length-1)) - size))

                winner.style['font-size'] = `${size+1}px`
              }
            }
          }

          troll.setAttribute("data-signx", dirx)
          troll.setAttribute("data-signy", diry)
        })

        deadTrolls.forEach(troll => {
          let ind = TROLLS.indexOf(troll)
          if (ind > -1) {
            TROLLS.splice(ind, 1)
            troll.remove()
          }
        })
      }

      setInterval(updateTrolls, 0.05)

      function addTroll() {
        let troll = document.createElement("p")
        troll.innerHTML = "🧌"
        TROLLS.push(troll)

        troll.style['position'] = "absolute"
        troll.style['top'] = `${Math.random()*100}%`
        troll.style['left'] = `${Math.random()*100}%`
        troll.style['font-size'] = "25px"
        troll.setAttribute("data-signx", Math.sign(Math.random()-0.5))
        troll.setAttribute("data-signy", Math.sign(Math.random()-0.5))

        document.getElementById("troll-box").appendChild(troll)
      }

      function addNTrolls() {
        let n = parseInt(window.prompt("🧌s?"))

        for (i = 0; i < n; i++) {
          addTroll()
        }
      }

      function toggleEvolution() {
        evolution = !evolution

        window.alert(`evolution is now: ${evolution}`)
      }

      // me when i google and copy and  past ehte first result https://stackoverflow.com/questions/16089421/how-do-i-detect-keypresses-in-javascript
      document.onkeypress = function (e) {
        e = e || window.event

        if (e.key === "t") {
          addTroll()
        } else if (e.key === "T") {
          addNTrolls()
        } else if (e.key === "e" || e.key === "E") {
          toggleEvolution()
        }
      }
    </script>
  </head>
  <body>
    <h1>we are IN conTROLL!!!!!</h1>
    <p>🧌🧌🧌🧌🧌🧌🧌🧌</p>
    <p>press 't' to unleash a 🧌. press "T" (with passion) to unleash n-🧌s. press 'e' to toggle evolution</p>
    <div class="mobileOnly">
      <p>🧌 magic tells me you might not have a keyboard, have these buttons instead:</p>
      <button onclick="addTroll()">🧌</button>
      <button onclick="addNTrolls()">🧌🧌🧌🧌🧌</button>
      <button onclick="toggleEvolution()" style="font-size: larger;">★🧌★</button>
    </div>
    <div id="troll-box" style="width: 90%; height: 90%; border: 1px black solid; justify-self: center; contain: content;">

    </div>
  </body>
</html>
